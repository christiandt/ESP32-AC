; ESP32-AC — Seeed XIAO ESP32C6 bridge exposing two AC units over REST + HomeKit.
;
; Toolchain note: the stock `espressif32` platform pins Arduino core 2.x, which
; has no ESP32-C6 support at all. `pioarduino` is the community fork that tracks
; Arduino core 3.x / ESP-IDF 5.x and does support the C6. See README.md.

[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; The default scheme leaves ~1.3 MB for the app, which HomeSpan plus two
; protocol stacks would crowd. min_spiffs gives ~1.9 MB and keeps dual-OTA —
; worth having on a device that ends up behind a wall socket.
board_build.partitions = min_spiffs.csv
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; Host-native env for the protocol code under src/proto/, which is deliberately
; free of Arduino/ESP-IDF includes so framing and crypto bugs can be caught
; without flashing anything. See test/README.md.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -DAC_NATIVE_TEST
    -I src
build_src_filter = -<*> +<proto/>
test_framework = unity
; Without this the test runner links only test/, and the proto sources it is
; testing are left out.
test_build_src = yes
